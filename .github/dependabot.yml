version: 2

updates:
  # Angular frontend
  - package-ecosystem: "npm"
    directory: "/ui/src/main/webui"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Angular 22 needs TS 6.0, Optimus UI 2.x and OIDC client 22 together: upgrade manually as one set.
      - dependency-name: "@angular/*"
        update-types: ["version-update:semver-major"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      - dependency-name: "tailwindcss"
        update-types: ["version-update:semver-major"]
      - dependency-name: "jsdom"
        update-types: ["version-update:semver-major"]
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # Java/Maven modules (api, core, storage, server, cli, migration) — resolved
  # from the root reactor pom.xml.
  - package-ecosystem: "maven"
    directory: "/"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 10
    ignore:
      # Tika 4 is a breaking API change (see MimeTypeDetector): migrate deliberately.
      - dependency-name: "org.apache.tika:*"
        update-types: ["version-update:semver-major"]
    groups:
      maven-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore"
      include: "scope"

  # GitHub Actions workflow dependencies
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      github-actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore"
      include: "scope"
