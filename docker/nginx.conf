server {
    listen 80;
    # Self-signed cert for LAN/testing access — crypto.subtle (needed for
    # PKCE in angular-auth-oidc-client) is only exposed by browsers in a
    # secure context (HTTPS, or http://localhost). Cert/key are bind-mounted
    # from ../.certs (see docker-compose.yml), never baked into the image.
    listen 443 ssl;
    ssl_certificate /etc/nginx/certs/selfsigned.crt;
    ssl_certificate_key /etc/nginx/certs/selfsigned.key;
    root /usr/share/nginx/html;
    index index.html;

    # Proxy to backend: REST API, Quarkus management, and OIDC config endpoint
    location /api/ {
        proxy_pass http://sam-server:8080;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Port 9000 = quarkus.management.port, pinned in server/src/main/resources/application.properties.
    # Keep in sync with monitoring/prometheus.yml if that value ever changes.
    location /q/ {
        proxy_pass http://sam-server:9000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # OidcConfigResource is a JAX-RS resource, so it lives under the
    # @ApplicationPath("/api") prefix like every other backend endpoint —
    # rewrite to /api/oidc-config.json even though the public path has none.
    location = /oidc-config.json {
        proxy_pass http://sam-server:8080/api/oidc-config.json;
        proxy_set_header Host $host;
    }

    # Proxy Keycloak itself through the same TLS front door. The browser talks
    # to Keycloak directly (discovery fetch, login page, redirects) — if the
    # SPA is served over HTTPS but Keycloak stays on plain HTTP, browsers block
    # those as mixed content. KC_HOSTNAME (docker-compose.yml) must match this
    # public origin so tokens/URLs Keycloak generates point back here too.
    # $host drops the port (nginx docs: "$host does not contain port"), and
    # without proxy-header trust Keycloak assumes plain http — both needed so
    # KC_HOSTNAME_BACKCHANNEL_DYNAMIC (docker-compose.yml) derives the right
    # externally-visible https://…:8443 endpoints instead of quietly falling
    # back to http://…(no port).
    location /realms/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /resources/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /js/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Admin REST API + admin console SPA (http://.../admin/master/console/).
    location /admin/ {
        proxy_pass http://keycloak:8080;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # nginx's stock mime.types has no entry for .mjs (ES module scripts) — served as
    # application/octet-stream otherwise, which browsers refuse to execute as a module
    # (silently: no console error, the script just never runs). Needed for
    # ngx-extended-pdf-viewer's pdf.js bundle under /assets/.
    location ~ \.mjs$ {
        default_type application/javascript;
    }

    # Angular SPA — fall back to index.html for client-side routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
